<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum — Discord's Most Advanced Bot</title>
  <meta name="description" content="Anti-nuke, anti-raid, 250+ commands, 24/7 uptime, lowest ping. Quantum is the last Discord bot your server will ever need." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       RESET & ROOT
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mx: 50vw;
      --my: 50vh;
      --bg: #030408;
      --surface: rgba(255,255,255,0.045);
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f5;
      --muted: rgba(240,240,245,0.55);
      --blue: #0077ff;
      --cyan: #00f0ff;
      --violet: #7c5cff;
      --pink: #f472b6;
      --green: #34d399;
      --amber: #fbbf24;
      --radius: 20px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: -0.011em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: rgba(0,240,255,0.3); color: #fff; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #030408; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--blue), var(--cyan));
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #3399ff, #33ffff); }

    img, svg { display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ============================================================
       KEYFRAMES
    ============================================================ */
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes auroraMove {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      33% { transform: translate3d(60px,-40px,0) scale(1.12); }
      66% { transform: translate3d(-50px,50px,0) scale(0.94); }
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 0.8; }
      80%, 100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(28px); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes marquee {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-50%,0,0); }
    }

    /* ============================================================
       UTILITY CLASSES
    ============================================================ */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .text-gradient {
      background-image: linear-gradient(100deg, #0077ff 0%, #00f0ff 40%, #7c5cff 80%, #0077ff 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 8s ease infinite;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 14px;
      padding: 14px 26px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s, background 0.3s, border-color 0.3s;
      will-change: transform;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      color: #fff;
      background-image: linear-gradient(100deg, #0077ff, #00f0ff);
      background-size: 180% 100%;
      box-shadow: 0 12px 34px -12px rgba(0,240,255,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
      animation: gradientShift 6s ease infinite;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 48px -14px rgba(0,240,255,0.8), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .btn-glass {
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
    }
    .btn-glass:hover {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }

    /* ============================================================
       BACKGROUND LAYERS
    ============================================================ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-base { position: absolute; inset: 0; background: #030408; }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      animation: auroraMove 24s ease-in-out infinite;
      will-change: transform;
    }
    .blob-1 { top: -20%; left: -10%; width: 65vh; height: 65vh; background: rgba(0,119,255,0.25); }
    .blob-2 { top: 10%; right: -15%; width: 60vh; height: 60vh; background: rgba(0,240,255,0.18); animation-delay: -8s; }
    .blob-3 { bottom: -25%; left: 20%; width: 70vh; height: 70vh; background: rgba(124,92,255,0.15); animation-delay: -16s; }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 100%);
    }

    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--mx) var(--my), rgba(0,240,255,0.08), transparent 60%);
      transition: background 0.1s linear;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 20%, #030408 100%);
    }

    .site { position: relative; z-index: 1; }

    /* ============================================================
       NAVBAR
    ============================================================ */
    .navbar-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 24px 0;
      transition: padding 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .navbar-wrap.scrolled { padding-top: 12px; }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      border-radius: 18px;
      border: 1px solid transparent;
      transition: all 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .navbar.scrolled {
      background: rgba(10,11,18,0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px -20px rgba(0,0,0,0.9);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    
    /* Custom Logo Image */
    .brand-logo {
      width: 38px; height: 38px;
      border-radius: 10px;
      object-fit: cover;
      filter: drop-shadow(0 4px 12px rgba(0,240,255,0.4));
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-link {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      transition: color 0.25s, background 0.25s;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.06); }

    .nav-actions { display: flex; align-items: center; gap: 10px; }

    .hamburger {
      display: none;
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      place-items: center;
      color: #fff;
    }

    .mobile-menu {
      display: none;
      max-width: 1200px;
      margin: 10px auto 0;
      padding: 16px;
      border-radius: 18px;
      background: rgba(10,11,18,0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      flex-direction: column;
      gap: 6px;
      animation: revealUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.8);
    }
    .mobile-menu a:hover { background: rgba(255,255,255,0.06); color: #fff; }

    /* ============================================================
       HERO
    ============================================================ */
    .hero {
      position: relative;
      padding: 170px 0 100px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-radius: 999px;
      border: 1px solid rgba(0,240,255,0.3);
      background: rgba(0,240,255,0.08);
      padding: 8px 16px;
      font-size: 12.5px;
      font-weight: 500;
      color: #a5f3fc;
      backdrop-filter: blur(12px);
      animation: revealUp 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }
    .live-dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }
    .live-dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--cyan);
      animation: ping 2s cubic-bezier(0,0,0.2,1) infinite;
    }

    .hero h1 {
      margin-top: 24px;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.045em;
      animation: revealUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.08s both;
    }

    .hero-sub {
      margin-top: 24px;
      max-width: 540px;
      font-size: 17px;
      line-height: 1.7;
      color: rgba(240,240,245,0.6);
      animation: revealUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.16s both;
    }

    .hero-actions {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      animation: revealUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.24s both;
    }
    .hero-actions .btn { padding: 15px 30px; font-size: 15px; }

    .hero-trust {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 24px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      animation: revealUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.32s both;
    }
    .hero-trust span { display: inline-flex; align-items: center; gap: 8px; }

    /* HERO VISUAL */
    .hero-visual {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      animation: revealUp 1.1s cubic-bezier(0.22,1,0.36,1) 0.2s both;
    }
    
    .hero-logo-container {
      position: absolute;
      inset: 15%;
      display: grid;
      place-items: center;
      z-index: 10;
      animation: floaty 6s ease-in-out infinite;
    }

    .hero-logo-main {
      width: 80%;
      height: 80%;
      border-radius: 25%;
      object-fit: cover;
      filter: drop-shadow(0 20px 50px rgba(0,240,255,0.4));
    }

    .orb-glow {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #0077ff, #00f0ff, #7c5cff, #0077ff);
      filter: blur(60px);
      opacity: 0.4;
      animation: spinSlow 20s linear infinite;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .ring-1 { inset: 0; }
    .ring-2 { inset: 8%; border-color: rgba(0,240,255,0.15); }
    .ring-3 {
      inset: 20%;
      border: 1px dashed rgba(255,255,255,0.12);
      animation: spinSlow 30s linear infinite;
    }
    .ring-4 {
      inset: 32%;
      border: 1px solid rgba(0,119,255,0.2);
      animation: spinSlow 15s linear infinite reverse;
    }

    .chip {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      background: rgba(12,13,22,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.9);
      white-space: nowrap;
      animation: floaty 7s ease-in-out infinite;
      z-index: 20;
    }
    .chip-1 { top: 12%; left: -8%; animation-delay: 0s; }
    .chip-2 { top: 28%; right: -12%; animation-delay: -1.6s; animation-duration: 8.5s; }
    .chip-3 { bottom: 22%; left: -10%; animation-delay: -3.2s; animation-duration: 9.5s; }
    .chip-4 { bottom: 10%; right: -6%; animation-delay: -4.8s; animation-duration: 7.8s; }

    .chip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ============================================================
       MARQUEE
    ============================================================ */
    .marquee-section {
      position: relative;
      padding: 24px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      overflow: hidden;
    }
    .marquee-mask {
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    }
    .marquee-track {
      display: flex;
      width: max-content;
      align-items: center;
      animation: marquee 40s linear infinite;
      will-change: transform;
    }
    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }
    .marquee-item .sep { color: rgba(0,240,255,0.5); font-size: 12px; }
    .marquee-section:hover .marquee-track { animation-play-state: paused; }

    /* ============================================================
       SECTIONS & HEADERS
    ============================================================ */
    .section { position: relative; padding: 110px 0; }

    .section-head {
      max-width: 680px;
      margin: 0 auto 64px;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 12px;
    }
    .section-head h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }
    .section-head p {
      margin-top: 16px;
      font-size: 16.5px;
      line-height: 1.7;
      color: rgba(240,240,245,0.55);
    }

    /* ============================================================
       STATS
    ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .stat-card {
      padding: 32px 28px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      backdrop-filter: blur(12px);
      transition: transform 0.4s, border-color 0.4s;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0,240,255,0.3);
    }
    .stat-value {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-top: 16px;
    }
    .stat-label {
      margin-top: 6px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    /* ============================================================
       FEATURES
    ============================================================ */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .feature-card {
      padding: 30px 26px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      backdrop-filter: blur(12px);
      transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
      position: relative;
      overflow: hidden;
    }
    .feature-card:hover {
      transform: translateY(-6px);
      border-color: rgba(0,119,255,0.4);
      box-shadow: 0 20px 50px -20px rgba(0,119,255,0.4);
    }
    .feature-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid rgba(0,240,255,0.2);
      background: linear-gradient(140deg, rgba(0,119,255,0.15), rgba(0,240,255,0.05));
    }
    .feature-card h3 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    .feature-card p {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(240,240,245,0.5);
    }

    /* ============================================================
       MANIFESTO (3 LINES)
    ============================================================ */
    .manifesto {
      position: relative;
      padding: 120px 0;
      text-align: center;
      overflow: hidden;
    }
    .manifesto-line {
      font-size: clamp(1.8rem, 4.5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.2;
      padding: 12px 0;
      opacity: 0;
      transform: translateY(30px);
      filter: blur(8px);
      transition: opacity 0.8s, transform 0.8s, filter 0.8s;
    }
    .manifesto-line.visible { opacity: 1; transform: translateY(0); filter: blur(0); }
    .manifesto-line.dim { color: rgba(255,255,255,0.2); }

    /* ============================================================
       PRICING
    ============================================================ */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      align-items: start;
    }
    .price-card {
      padding: 40px 36px;
      border-radius: 26px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0
